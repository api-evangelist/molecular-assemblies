name: Molecular Assemblies
description: Molecular Assemblies is a synthetic biology company that developed a Fully Enzymatic
  Synthesis (FES) platform for de novo DNA production, using enzymatic chemistry to synthesize
  longer (up to ~400 base), higher-purity oligonucleotides faster than traditional phosphoramidite
  methods, targeting next-generation sequencing, gene synthesis, diagnostics, and therapeutics
  markets. Originally a DCVC-backed startup, the company's assets and intellectual property were
  acquired by Maravai LifeSciences, and its enzymatic DNA synthesis technology is now part of
  TriLink BioTechnologies. As of this enrichment pass the company exposes no public API, developer
  portal, SDK, or machine-readable developer surface; its former molecularassemblies.com domain
  now redirects to TriLink BioTechnologies.
